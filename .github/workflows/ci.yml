name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steven
          POSTGRES_PASSWORD: test
          POSTGRES_DB: inventory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://steven:test@localhost:5432/inventory_test
      TEST_DATABASE_URL: postgresql://steven:test@localhost:5432/inventory_test
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: psql "$TEST_DATABASE_URL" -f schema.sql
      - run: uv run pytest --cov=app --cov-report=term-missing