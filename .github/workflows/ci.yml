name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The same steps the README gives for a fresh clone, so a green badge
      # means those steps work.
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yml up -d --wait
      - run: uv sync --frozen
      - run: uv run pytest --cov=app --cov-report=term-missing

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inventory-api .
