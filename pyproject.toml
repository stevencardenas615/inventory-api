[project]
name = "inventory-api"
version = "0.2.0"
description = "REST API for tracking liquidation inventory from manifest intake to sale"
readme = "README.md"
authors = [
    { name = "Steven Cardenas", email = "283815984+stevencardenas615@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
